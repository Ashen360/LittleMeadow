<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Meadow</title>
<style>
  html, body { margin: 0; height: 100%; background: #1d1520; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas {
    display: block;
    outline: none;
    image-rendering: crisp-edges;
    image-rendering: pixelated;
  }
  #boot {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 16px; color: #fbe9c8; background: #1d1520;
    font: 16px/1.6 system-ui, sans-serif; text-align: center;
  }
  #boot code { color: #f6d87a; }
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="Little Meadow"></canvas>
<div id="boot">Loading Little Meadow…</div>
<!-- DEV-ONLY:START -->
<script>
  if (location.protocol === 'file:') {
    document.getElementById('boot').innerHTML =
      'This is the development page, which browsers won\'t run straight from disk.<br>' +
      'To play, open <code>Play Little Meadow.html</code> (in the same folder) instead,<br>' +
      'or start the dev server with <code>node tools/serve.mjs</code>.';
  }
</script>
<script type="module" src="src/main.js"></script>
<!-- DEV-ONLY:END -->
</body>
</html>
